[package]
name = "contentcraft"
version = "0.1.0"
edition = "2021"

[lib]
name = "contentcraft_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "contentcraft"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
# keyring v3/v4's convenience API doesn't expose new_with_modifiers, which we need
# to force CRED_PERSIST_LOCAL_MACHINE on Windows (local accounts can't use ENTERPRISE).
# Use keyring-core + platform stores directly, same pattern as Lumia Career.
keyring-core = "1.0.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1.0"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
apple-native-keyring-store = { version = "1.0.1", features = ["keychain"] }

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.0", features = ["crypto-rust"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
